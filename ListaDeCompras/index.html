<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lista de Compras</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="app">
    <h1>🛒 Lista de Compras</h1>

    <form id="item-form">
      <input type="text" id="item-name" placeholder="Nome do item" required />
      <input type="number" id="item-qty" placeholder="Qtd" min="1" value="1" required />
      <input type="number" id="item-price" placeholder="Preço unit. (R$)" min="0" step="0.01" required />
      <button type="submit">Adicionar</button>
    </form>

    <table id="items-table">
      <thead>
        <tr>
          <th>Item</th>
          <th>Qtd</th>
          <th>Preço Unit.</th>
          <th>Subtotal</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="items-body">
        <!-- linhas geradas dinamicamente pelo script.js -->
      </tbody>
    </table>

    <p id="empty-message">Nenhum item adicionado ainda.</p>

    <div id="total-row">
      <span>Total:</span>
      <span id="total-value">R$ 0,00</span>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
