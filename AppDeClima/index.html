<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>App de Clima</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="app">
    <h1>☀️ Clima</h1>

    <form id="search-form">
      <input type="text" id="city-input" placeholder="Digite uma cidade..." autocomplete="off" />
      <button type="submit">Buscar</button>
    </form>

    <p id="loading" class="hidden">Carregando...</p>
    <p id="error" class="hidden">Cidade não encontrada. Tente novamente.</p>

    <section id="weather-card" class="hidden">
      <h2 id="city-name">Nome da cidade</h2>
      <p id="weather-description">Descrição do tempo</p>
      <div id="temperature">--°C</div>
      <div id="extra-info">
        <span id="humidity">Umidade: --%</span>
        <span id="wind">Vento: -- km/h</span>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
